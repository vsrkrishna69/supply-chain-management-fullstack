<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Product Management</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="header">
    <h1>Product Management</h1>
    <a href="/dashboard"><button>Back to Dashboard</button></a>
</div>

<form onsubmit="addProduct(event)" class="form">
    <input type="text"   id="name"       placeholder="Product Name"   required>
    <input type="number" id="price"      placeholder="Price"          step="0.01" required>
    <input type="number" id="quantity"   placeholder="Quantity"       required>
    <input type="number" id="supplierId" placeholder="Supplier ID"    required>
    <input type="number" id="orderId"    placeholder="Order ID"       required>
    <button type="submit">Add Product</button>
</form>

<br>

<table>
    <thead>
        <tr>
            <th>ID</th><th>Name</th><th>Price</th><th>Quantity</th><th>Action</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script src="/script.js"></script>
</body>
</html>
